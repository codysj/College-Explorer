name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tags are mutable); Dependabot keeps them current.
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Generated API types match the backend schema
        run: |
          npm run generate:api-types
          git diff --exit-code -- types/api.gen.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Production dependencies only. Dev-only advisories (Tailwind 3 and eslint-config-next
      # transitive globbing libraries) need major upgrades and never ship to users.
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: college_exploration
          POSTGRES_USER: college
          POSTGRES_PASSWORD: college
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U college -d college_exploration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://college:college@127.0.0.1:5432/college_exploration
      TEST_DATABASE_URL: postgresql+psycopg://college:college@127.0.0.1:5432/college_exploration
      REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: python -m pip install -r apps/api/requirements-dev.txt pip-audit
      - name: Migrate
        working-directory: apps/api
        run: alembic upgrade head
      - name: Models match migrations
        working-directory: apps/api
        run: alembic check
      - name: Seed the 92-school snapshot
        run: python apps/api/scripts/seed_database.py
      - name: Tests (unit + Postgres integration)
        run: python -m pytest apps/api/tests
      - name: Audit runtime dependencies
        run: pip-audit --requirement apps/api/requirements.txt --strict
      - name: Committed OpenAPI schema matches the code
        run: |
          python apps/api/scripts/export_openapi.py > apps/web/types/openapi.json
          git diff --exit-code -- apps/web/types/openapi.json

  containers:
    name: Containers and infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build both images
        run: docker compose build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Lint the SAM template
        run: |
          python -m pip install cfn-lint
          cfn-lint infra/aws/template.yaml
